version: 2

models:
  - name: fct_trades
    description: Fact table, one row per trade (full history) with trade_value and taker_side.
    columns:
      - name: trade_uid
        tests:
          - not_null
          - unique
      - name: symbol
        tests: [not_null]
      - name: trade_id
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: traded_at
        tests: [not_null]
      - name: taker_side
        tests:
          - accepted_values:
              values: ['buy', 'sell']

  - name: fct_depth_snapshots
    description: Fact table, one row per (symbol, side, level) order-book level per snapshot.
    columns:
      - name: symbol
        tests: [not_null]
      - name: side
        tests:
          - not_null
          - accepted_values:
              values: ['bid', 'ask']
      - name: level
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: qty
        tests: [not_null]

  - name: vw_ohlcv_1min_live
    description: LIVE view, 1-minute OHLCV per symbol over the last 120 minutes.
    columns:
      - name: symbol
        tests: [not_null]
      - name: minute
        tests: [not_null]

  - name: vw_orderbook_metrics_live
    description: LIVE view, latest order-book snapshot metrics per symbol (selected via last_update_id).
    columns:
      - name: symbol
        tests:
          - not_null
          - unique

  - name: vw_market_metrics_live
    description: LIVE view, derived market metrics (price change %, volume z-score, realized vol, RSI-14) per symbol & minute.
    columns:
      - name: symbol
        tests: [not_null]
      - name: minute
        tests: [not_null]

  - name: fct_ohlcv_1min
    description: Incremental table (full-history 1-minute OHLCV per symbol) - pas une Dynamic Table car min_by/max_by ne sont pas maintenables incrementalement.
    columns:
      - name: symbol
        tests: [not_null]
      - name: minute
        tests: [not_null]

  - name: fct_orderbook_snapshots
    description: Dynamic Table, order-book metrics per symbol & ingest_time (full history, target_lag 5 minute - choix FinOps).
    columns:
      - name: symbol
        tests: [not_null]
      - name: ingest_time
        tests: [not_null]
