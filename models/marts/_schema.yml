version: 2

models:
  - name: fct_trades
    description: Fact table, one row per trade (full history) with trade_value and taker_side.
    columns:
      - name: trade_uid
        tests:
          - not_null
          - unique
      - name: symbol
        tests: [not_null]
      - name: trade_id
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: traded_at
        tests: [not_null]

  - name: fct_depth_snapshots
    description: Fact table, one row per (symbol, side, level) order-book level per snapshot.
    columns:
      - name: symbol
        tests: [not_null]
      - name: side
        tests:
          - not_null
          - accepted_values:
              values: ['bid', 'ask']
      - name: level
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: qty
        tests: [not_null]
