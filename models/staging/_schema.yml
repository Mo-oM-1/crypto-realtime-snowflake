version: 2

models:
  - name: stg_trades
    description: One row per trade, deduplicated on (symbol, trade_id). Epoch-ms converted to TIMESTAMP_NTZ.
    columns:
      - name: trade_uid
        description: Surrogate key (symbol-trade_id), unique across the model.
        tests:
          - not_null
          - unique
      - name: symbol
        description: Trading pair, derived from the stream name (e.g. BTCUSDT).
        tests: [not_null]
      - name: trade_id
        description: Binance trade id, unique within a symbol.
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: traded_at
        description: Trade time (event field T) as TIMESTAMP_NTZ.
        tests: [not_null]

  - name: stg_depth_levels
    description: One row per (symbol, side, level) exploded from the bids/asks arrays of each depth snapshot.
    columns:
      - name: symbol
        tests: [not_null]
      - name: side
        tests:
          - not_null
          - accepted_values:
              values: ['bid', 'ask']
      - name: level
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: qty
        tests: [not_null]
