# profiles.yml - pour dbt Projects on Snowflake (execution native dans Snowflake).
# account/user peuvent rester arbitraires : le projet tourne sous le contexte Snowflake
# (role/entrepot ci-dessous) ou, en CI, sous la connexion du Snowflake CLI. Aucun secret ici.
#
# Targets (3 environnements a bases ISOLEES) :
#   dev  -> usage interactif (Workspace Snowsight), base DEDIEE -> ANALYTICS_DEV (cf. 09_dev_setup.sql)
#   prod -> deploiement de production (merge sur main)          -> ANALYTICS
#   ci   -> validation des Pull Requests, base ISOLEE           -> ANALYTICS_CI
crypto_realtime:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: unused
      user: unused
      role: CRYPTO_PIPELINE_ROLE
      warehouse: WH_CRYPTO_XS
      database: ANALYTICS_DEV   # base de dev isolee de la prod (cf. snowflake/09_dev_setup.sql)
      schema: PUBLIC            # dbt creera PUBLIC_STAGING / PUBLIC_INTERMEDIATE / PUBLIC_MARTS
      threads: 8

    prod:
      type: snowflake
      account: unused
      user: unused
      role: CRYPTO_PIPELINE_ROLE
      warehouse: WH_CRYPTO_XS
      database: ANALYTICS
      schema: PUBLIC
      threads: 8

    ci:
      type: snowflake
      account: unused
      user: unused
      role: CRYPTO_CI_ROLE
      warehouse: WH_CRYPTO_XS
      database: ANALYTICS_CI   # base jetable, isolee de la prod (cf. snowflake/06_ci_setup.sql)
      schema: PUBLIC
      threads: 8
