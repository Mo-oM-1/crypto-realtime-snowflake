# Copier vers ~/.dbt/profiles.yml (dbt Core / Cortex Code CLI).
# Avec "dbt Projects on Snowflake", la connexion est gérée par Snowflake : ce
# fichier sert surtout pour exécuter dbt en local.
crypto_realtime:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "<account_identifier>"
      user: "<TON_USER>"
      # --- Auth key-pair (recommandé) ---
      private_key_path: "rsa_key.p8"
      # --- ou mot de passe ---
      # password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: CRYPTO_PIPELINE_ROLE
      warehouse: WH_CRYPTO_XS
      database: ANALYTICS
      schema: PUBLIC          # dbt créera PUBLIC_STAGING / PUBLIC_INTERMEDIATE / PUBLIC_MARTS
      threads: 8
